# 수동 실행: 서명된 안드로이드 앱 번들(.aab)을 만들어 아티팩트로 올림 (Play Console 업로드용)
name: Android release
on: workflow_dispatch
jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build:android
        env:
          VITE_ADMOB_INTERSTITIAL: ${{ vars.ADMOB_INTERSTITIAL }}
          VITE_ADMOB_REWARDED: ${{ vars.ADMOB_REWARDED }}
          VITE_AD_TEST: ${{ vars.AD_TEST || '1' }}
      # 업로드 키: Secrets 에 ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload.jks
      - run: ./gradlew bundleRelease
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with: { name: zero-to-legend-aab, path: android/app/build/outputs/bundle/release/*.aab }
