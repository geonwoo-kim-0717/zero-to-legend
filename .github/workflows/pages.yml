# main에 푸시하면 웹 버전(AdSense H5 광고 모드)을 GitHub Pages에 배포
name: Deploy web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # 빌드 번호(커밋 수)를 세려면 전체 기록이 필요
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:web
        env:
          # 게시자 ID는 .env.web 에 있음. 승인 후 저장소 Variables 에 AD_TEST=0 을 넣으면 실제 광고
          VITE_AD_TEST: ${{ vars.AD_TEST || '1' }}
      # 기존 판: legacy 브랜치를 따로 빌드해 dist/legacy/ 에 넣음 (?legacy 로 열면 이리로 감, 예전 저장 그대로)
      - uses: actions/checkout@v4
        with: { ref: legacy, path: legacy-src, fetch-depth: 0 }
      - run: npm ci && npm run build:web && mkdir -p ../dist/legacy && cp -r dist/. ../dist/legacy/ && rm -f ../dist/legacy/ads.txt ../dist/legacy/robots.txt ../dist/legacy/sitemap.xml ../dist/legacy/google*.html
        working-directory: legacy-src
        env:
          VITE_AD_TEST: '1'
      # 개편 브랜치 미리보기: dist/redesign/ (?preview 로 열면 이리로 감)
      - uses: actions/checkout@v4
        with: { ref: redesign/step1-twinstick, path: redesign-src, fetch-depth: 0 }
      - run: npm ci && npm run build:web && mkdir -p ../dist/redesign && cp -r dist/. ../dist/redesign/ && rm -f ../dist/redesign/ads.txt ../dist/redesign/robots.txt ../dist/redesign/sitemap.xml ../dist/redesign/google*.html
        working-directory: redesign-src
        env:
          VITE_AD_TEST: '1'
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
