# main에 푸시하면 웹 버전(AdSense H5 광고 모드)을 GitHub Pages에 배포
name: Deploy web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:web
        env:
          # 게시자 ID는 .env.web 에 있음. 승인 후 저장소 Variables 에 AD_TEST=0 을 넣으면 실제 광고
          VITE_AD_TEST: ${{ vars.AD_TEST || '1' }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
