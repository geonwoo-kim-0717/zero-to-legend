<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Zero to Legend</title>
  <meta name="description" content="네온 사이버펑크 도시에서 무기와 사이버웨어를 모아 30분을 버티는 무료 웹 로그라이트. 설치 없이 브라우저와 휴대폰에서 바로 플레이. A free neon cyberpunk auto-battler roguelite you play in the browser." />
  <link rel="canonical" href="https://geonwoo-kim-0717.github.io/zero-to-legend/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Zero to Legend" />
  <meta property="og:title" content="Zero to Legend — 네온 사이버펑크 로그라이트" />
  <meta property="og:description" content="이동만 하세요. 무기는 알아서 쏩니다. 30분, 3챕터, 보스 6종. 설치 없이 바로 플레이." />
  <meta property="og:url" content="https://geonwoo-kim-0717.github.io/zero-to-legend/" />
  <meta property="og:image" content="https://geonwoo-kim-0717.github.io/zero-to-legend/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Zero to Legend" />
  <meta name="twitter:description" content="Neon cyberpunk auto-battler roguelite. Move, survive 30 minutes, beat 6 bosses. Free in your browser." />
  <meta name="twitter:image" content="https://geonwoo-kim-0717.github.io/zero-to-legend/og.jpg" />
  <!-- 홈 화면에 추가하면 주소창 없이 전체화면으로 실행 (iPhone은 브라우저 전체화면 대신 이 방법) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#07060f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Zero to Legend" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <style>
    /* 게임에 쓰는 글자만 담은 글꼴 (tools/font/subset.py 로 생성, 외부 서버 불필요) */
    @font-face { font-family: "Noto Sans KR"; font-weight: 500 700; font-display: block; src: url("fonts/NotoSansKR-700.woff2") format("woff2"); }
    @font-face { font-family: "Noto Sans KR"; font-weight: 800 900; font-display: block; src: url("fonts/NotoSansKR-900.woff2") format("woff2"); }
    html, body { margin: 0; height: 100%; background: #07060f; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    /* 화면 전체를 기준으로 (아이폰 홈 화면 실행에서 높이가 덜 잡히는 문제 방지) */
    #game { position: fixed; inset: 0; background: #07060f; }
    /* 휴대폰을 세로로 들면 가로로 돌리라는 안내 (게임은 자동으로 일시정지) */
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #07060f; color: #e8f7ff;
      font: 700 18px "Noto Sans KR", sans-serif; text-align: center; align-items: center; justify-content: center; flex-direction: column; gap: 14px; }
    #rotate .icon { width: 44px; height: 72px; border: 3px solid #ff2bd6; border-radius: 8px; animation: turn 1.6s ease-in-out infinite; }
    #rotate small { color: #8a7aa8; font-size: 13px; font-weight: 500; }
    @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    @media (prefers-reduced-motion: reduce) { #rotate .icon { animation: none; transform: rotate(-90deg); } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate"><div class="icon"></div><div>화면을 가로로 돌려주세요</div><small>게임은 잠시 멈춰 있어요</small></div>
  <div id="inapp" style="display:none;position:fixed;inset:0;z-index:20;background:#07060f;color:#e8f7ff;font:700 16px 'Noto Sans KR',sans-serif;text-align:center;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px">
    <div id="inapp-msg"></div>
    <button id="inapp-open" style="font:inherit;padding:10px 18px;border:2px solid #ff2bd6;background:#120a24;color:#ff2bd6;border-radius:8px"></button>
    <button id="inapp-stay" style="font:500 13px 'Noto Sans KR',sans-serif;background:none;border:0;color:#8a7aa8;text-decoration:underline"></button>
  </div>
  <script>
    // 카카오톡·인스타그램 같은 앱 안 브라우저는 전체화면을 막는다 → 기본 브라우저로 열도록 안내
    (function () {
      try {
        if (window.self !== window.top) return; // 포털(iframe) 안에서는 건드리지 않음
        var ua = navigator.userAgent || '';
        var url = location.href;
        var ko = (navigator.language || '').toLowerCase().indexOf('ko') === 0;
        var android = /Android/i.test(ua);
        var openExternal = null;
        var inapp = /Instagram|FBAN|FBAV|NAVER\(inapp|DaumApps|BAND\/|everytimeApp|KAKAOSTORY/i;
        if (/KAKAOTALK/i.test(ua)) openExternal = function () { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url); };
        else if (/ Line\//i.test(ua)) openExternal = function () { location.href = url + (url.indexOf('?') < 0 ? '?' : '&') + 'openExternalBrowser=1'; };
        else if (inapp.test(ua)) {
          if (android) openExternal = function () { location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end'; };
        } else return;
        if (/KAKAOTALK/i.test(ua) && sessionStorage.getItem('ztl-ext') !== '1') { sessionStorage.setItem('ztl-ext', '1'); openExternal(); }
        var box = document.getElementById('inapp');
        document.getElementById('inapp-msg').innerHTML = ko
          ? '앱 안 브라우저에서는 전체화면이 안 돼요.<br>기본 브라우저(Chrome·Safari)로 열어 주세요.' + (openExternal ? '' : '<br><small style="color:#8a7aa8;font-weight:500">오른쪽 위 ⋯ 메뉴 → "다른 브라우저로 열기"</small>')
          : 'Fullscreen does not work in in-app browsers.<br>Please open this page in Chrome or Safari.';
        var open = document.getElementById('inapp-open');
        open.textContent = openExternal ? (ko ? '기본 브라우저로 열기' : 'Open in browser') : (ko ? '링크 복사' : 'Copy link');
        open.onclick = function () {
          if (openExternal) openExternal();
          else if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { open.textContent = ko ? '복사됨! 브라우저에 붙여 넣으세요' : 'Copied!'; });
        };
        var stay = document.getElementById('inapp-stay');
        stay.textContent = ko ? '그냥 여기서 할게요 (전체화면 없이)' : 'Play here anyway (no fullscreen)';
        stay.onclick = function () { box.style.display = 'none'; };
        box.style.display = 'flex';
      } catch (e) {}
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
